<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-title" content="Denkpad"><link rel="manifest" href="manifest.json"><title>Denkpad</title>
<style>
:root{--bg:#121212;--s:#1b1b1b;--m:#6a6a6a;--t:#eee;--a:#b89f6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:18px/1.7 ui-serif,"Iowan Old Style",Georgia,serif}
body{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 28px)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}
h1{font-size:22px;font-weight:400;margin:0;letter-spacing:.02em}
.xp,.m{color:var(--m);font-size:14px;font-family:ui-monospace,Menlo,monospace}
h2{font-size:15px;font-weight:400;font-style:italic;color:var(--a);margin:30px 0 8px}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
.node{display:block;width:100%;text-align:left;background:var(--s);border:1px solid #2c2c2c;border-left:3px solid var(--a);padding:14px 16px;margin:0 0 8px}
.node.done{border-color:var(--a)}
.node:disabled{opacity:.35;border-left-color:var(--m)}
.p{width:100%;margin-top:20px;padding:14px;background:var(--a);color:#121212;border:0}
.c{font-style:italic;font-size:20px;border-left:3px solid var(--a);padding-left:16px}
a,label{color:var(--a);text-decoration:underline;cursor:pointer}
</style></head><body><div id="app"></div>
<script src="content.js"></script>
<script>
const K='denkpad',A=document.getElementById('app');
let S={xp:0,done:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const ok=n=>n.r.every(r=>S.done.includes(r));
function tree(){
 let h=`<div class=top><h1>Denkpad</h1><span class=xp>${S.xp} xp, ${S.done.length} van ${N.length}</span></div>`;
 for(const k in BR){h+=`<h2 style="--a:${BR[k][1]}">${BR[k][0]}</h2>`;
  for(const n of N.filter(n=>n.b==k)){const d=S.done.includes(n.id),o=ok(n);
   h+=`<button class="node ${d?'done':''}" style="--a:${BR[k][1]}" ${o?`onclick="go('${n.id}')"`:'disabled'}>${d?'✓ ':''}${n.n}</button>`}}
 h+=`<p class=m style="margin-top:36px"><a onclick=ex()>exporteer voortgang</a><br><label>importeer voortgang<input type=file hidden accept=.json onchange="im(this.files[0])"></label></p>`;
 A.innerHTML=h}
let L,i;
function go(id){const n=N.find(x=>x.id==id);L={n,c:BR[n.b][1],s:[['u',n.u],['q',...n.q],['d',...n.d],['c',...n.c]]};i=0;st()}
function st(){const[t,...a]=L.s[i];
 let h=`<div style="--a:${L.c}"><div class=top><h1>${L.n.n}</h1><span class=xp>${i+1} van 4</span></div>`;
 if(t=='u')h+=`<p>${a[0]}</p><button class=p onclick="nx(2)">Verder</button>`;
 if(t=='c')h+=`<p class=c>${a[0]}</p><p class=m>${a[1]}</p><button class=p onclick="nx(2)">Afronden</button>`;
 if(t=='q')h+=`<p>${a[0]}</p>`+[1,2,3].map(j=>`<button class=node id=o${j} onclick="pq(${j})">${a[j]}</button>`).join('');
 if(t=='d')h+=`<p>${a[0]}</p>`+[1,3].map(j=>`<button class=node id=o${j} onclick="pd(${j})">${a[j]}</button>`).join('');
 A.innerHTML=h+'<div id=f></div></div>'}
function fb(m,x){document.querySelectorAll('.node').forEach(b=>b.disabled=true);document.getElementById('f').innerHTML=`<p class=m>${m}</p><button class=p onclick="nx(${x})">Verder</button>`}
function pq(j){const a=L.s[i].slice(1),r=a[4]+1;document.getElementById('o'+r).classList.add('done');fb(j==r?'Juist.':'Niet helemaal. Het juiste antwoord is gemarkeerd.',j==r?10:3)}
function pd(j){const a=L.s[i].slice(1);document.getElementById('o'+j).classList.add('done');fb(a[j+1],5)}
function nx(x){S.xp+=x;i++;if(i<4){sv();st()}else{if(!S.done.includes(L.n.id)){S.done.push(L.n.id);S.xp+=5}sv();tree()}}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='denkpad.json';a.click()}
function im(f){if(!f)return;f.text().then(t=>{const d=JSON.parse(t);S.xp=d.xp|0;S.done=Array.isArray(d.done)?d.done:[];sv();tree()})}
tree();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
